<svg xmlns="http://www.w3.org/2000/svg" width="800" height="780" viewBox="0 0 800 780">
<rect x="0" y="0" width="800" height="780" fill="#f5f7fb"/>
<text x="30" y="30" font-family="Inter, Arial" font-size="20" font-weight="700" fill="#1f2937">Bank Transfer UI</text>
<text x="30" y="50" font-family="Inter, Arial" font-size="12" fill="#4b5563">Designed with Nielsen heuristics: visibility, consistency, error prevention, user control, recognition-over-recall.</text>
<rect x="40" y="60" width="720" height="40" rx="10" ry="10" fill="#ffffff" stroke="#cbd5e1"/>
<text x="54" y="84" font-family="Inter, Arial" font-size="14" fill="#111827">Header: New Transfer</text>
<rect x="40" y="130" width="720" height="60" rx="10" ry="10" fill="#ffffff" stroke="#cbd5e1"/>
<text x="54" y="154" font-family="Inter, Arial" font-size="14" fill="#111827">From Account Selector + Balance visibility</text>
<rect x="40" y="210" width="720" height="60" rx="10" ry="10" fill="#ffffff" stroke="#cbd5e1"/>
<text x="54" y="234" font-family="Inter, Arial" font-size="14" fill="#111827">Beneficiary Selector + Add New Payee</text>
<rect x="40" y="290" width="720" height="75" rx="10" ry="10" fill="#ffffff" stroke="#cbd5e1"/>
<text x="54" y="314" font-family="Inter, Arial" font-size="14" fill="#111827">Amount + Currency + Fee Preview</text>
<rect x="40" y="385" width="720" height="55" rx="10" ry="10" fill="#ffffff" stroke="#cbd5e1"/>
<text x="54" y="409" font-family="Inter, Arial" font-size="14" fill="#111827">Reference / Notes Field</text>
<rect x="40" y="460" width="720" height="55" rx="10" ry="10" fill="#ffffff" stroke="#cbd5e1"/>
<text x="54" y="484" font-family="Inter, Arial" font-size="14" fill="#111827">Risk/Limit Validation Banner</text>
<rect x="40" y="535" width="720" height="95" rx="10" ry="10" fill="#ffffff" stroke="#cbd5e1"/>
<text x="54" y="559" font-family="Inter, Arial" font-size="14" fill="#111827">Review Summary Card (before confirm)</text>
<rect x="40" y="650" width="720" height="55" rx="10" ry="10" fill="#ffffff" stroke="#cbd5e1"/>
<text x="54" y="674" font-family="Inter, Arial" font-size="14" fill="#111827">Primary CTA: Confirm Transfer | Secondary: Cancel</text>
<rect x="40" y="742" width="720" height="24" rx="6" fill="#e2e8f0"/>
<text x="50" y="758" font-family="Inter, Arial" font-size="11" fill="#334155">Figma-ready wireframe (SVG import). Recommended frame size: Desktop 1440, 12-column grid.</text>
</svg>
