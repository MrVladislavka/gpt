<svg xmlns="http://www.w3.org/2000/svg" width="800" height="780" viewBox="0 0 800 780">
<rect x="0" y="0" width="800" height="780" fill="#f5f7fb"/>
<text x="30" y="30" font-family="Inter, Arial" font-size="20" font-weight="700" fill="#1f2937">Registration UI</text>
<text x="30" y="50" font-family="Inter, Arial" font-size="12" fill="#4b5563">Designed with Nielsen heuristics: visibility, consistency, error prevention, user control, recognition-over-recall.</text>
<rect x="40" y="60" width="720" height="40" rx="10" ry="10" fill="#ffffff" stroke="#cbd5e1"/>
<text x="54" y="84" font-family="Inter, Arial" font-size="14" fill="#111827">Header: Create Your Online Banking Account</text>
<rect x="40" y="120" width="300" height="28" rx="10" ry="10" fill="#ffffff" stroke="#cbd5e1"/>
<text x="54" y="144" font-family="Inter, Arial" font-size="14" fill="#111827">Progress Indicator (Step 1 of 3)</text>
<rect x="40" y="170" width="720" height="110" rx="10" ry="10" fill="#ffffff" stroke="#cbd5e1"/>
<text x="54" y="194" font-family="Inter, Arial" font-size="14" fill="#111827">Personal Details Card (Name, Email, Phone)</text>
<rect x="40" y="300" width="720" height="110" rx="10" ry="10" fill="#ffffff" stroke="#cbd5e1"/>
<text x="54" y="324" font-family="Inter, Arial" font-size="14" fill="#111827">Identity Verification Card (ID Type, ID Number, Upload)</text>
<rect x="40" y="430" width="720" height="110" rx="10" ry="10" fill="#ffffff" stroke="#cbd5e1"/>
<text x="54" y="454" font-family="Inter, Arial" font-size="14" fill="#111827">Security Setup Card (Password + Strength Meter + Confirm)</text>
<rect x="40" y="560" width="720" height="70" rx="10" ry="10" fill="#ffffff" stroke="#cbd5e1"/>
<text x="54" y="584" font-family="Inter, Arial" font-size="14" fill="#111827">Consent & Terms Checkbox Area</text>
<rect x="40" y="650" width="720" height="50" rx="10" ry="10" fill="#ffffff" stroke="#cbd5e1"/>
<text x="54" y="674" font-family="Inter, Arial" font-size="14" fill="#111827">Primary CTA: Continue  | Secondary: Save Draft</text>
<rect x="40" y="720" width="720" height="40" rx="10" ry="10" fill="#ffffff" stroke="#cbd5e1"/>
<text x="54" y="744" font-family="Inter, Arial" font-size="14" fill="#111827">Inline Validation + Help Text Region</text>
<rect x="40" y="742" width="720" height="24" rx="6" fill="#e2e8f0"/>
<text x="50" y="758" font-family="Inter, Arial" font-size="11" fill="#334155">Figma-ready wireframe (SVG import). Recommended frame size: Desktop 1440, 12-column grid.</text>
</svg>
