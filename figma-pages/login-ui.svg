<svg xmlns="http://www.w3.org/2000/svg" width="800" height="780" viewBox="0 0 800 780">
<rect x="0" y="0" width="800" height="780" fill="#f5f7fb"/>
<text x="30" y="30" font-family="Inter, Arial" font-size="20" font-weight="700" fill="#1f2937">Login UI</text>
<text x="30" y="50" font-family="Inter, Arial" font-size="12" fill="#4b5563">Designed with Nielsen heuristics: visibility, consistency, error prevention, user control, recognition-over-recall.</text>
<rect x="40" y="60" width="720" height="40" rx="10" ry="10" fill="#ffffff" stroke="#cbd5e1"/>
<text x="54" y="84" font-family="Inter, Arial" font-size="14" fill="#111827">Header: Welcome Back</text>
<rect x="40" y="140" width="720" height="55" rx="10" ry="10" fill="#ffffff" stroke="#cbd5e1"/>
<text x="54" y="164" font-family="Inter, Arial" font-size="14" fill="#111827">Username/Email Field</text>
<rect x="40" y="210" width="720" height="55" rx="10" ry="10" fill="#ffffff" stroke="#cbd5e1"/>
<text x="54" y="234" font-family="Inter, Arial" font-size="14" fill="#111827">Password Field + Show/Hide Control</text>
<rect x="40" y="275" width="720" height="40" rx="10" ry="10" fill="#ffffff" stroke="#cbd5e1"/>
<text x="54" y="299" font-family="Inter, Arial" font-size="14" fill="#111827">Remember Me + Forgot Password</text>
<rect x="40" y="330" width="720" height="55" rx="10" ry="10" fill="#ffffff" stroke="#cbd5e1"/>
<text x="54" y="354" font-family="Inter, Arial" font-size="14" fill="#111827">Primary CTA: Sign In</text>
<rect x="40" y="410" width="720" height="100" rx="10" ry="10" fill="#ffffff" stroke="#cbd5e1"/>
<text x="54" y="434" font-family="Inter, Arial" font-size="14" fill="#111827">2FA Prompt Panel (OTP input + resend timer)</text>
<rect x="40" y="530" width="720" height="70" rx="10" ry="10" fill="#ffffff" stroke="#cbd5e1"/>
<text x="54" y="554" font-family="Inter, Arial" font-size="14" fill="#111827">Security Status Banner (last login + device)</text>
<rect x="40" y="620" width="720" height="50" rx="10" ry="10" fill="#ffffff" stroke="#cbd5e1"/>
<text x="54" y="644" font-family="Inter, Arial" font-size="14" fill="#111827">Support Link + Error Recovery Help</text>
<rect x="40" y="742" width="720" height="24" rx="6" fill="#e2e8f0"/>
<text x="50" y="758" font-family="Inter, Arial" font-size="11" fill="#334155">Figma-ready wireframe (SVG import). Recommended frame size: Desktop 1440, 12-column grid.</text>
</svg>
