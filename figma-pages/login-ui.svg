<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="900" viewBox="0 0 1280 900">
<rect width="1280" height="900" fill="#F3F7FF"/>
<rect x="0" y="0" width="1280" height="72" fill="#0B3D91"/>
<text x="36" y="45" fill="#FFFFFF" font-size="28" font-family="Inter" font-weight="700">Online Banking</text>
<rect x="390" y="140" width="500" height="620" rx="20" fill="#FFFFFF" stroke="#D8E1F0"/>
<text x="430" y="200" fill="#0F172A" font-size="34" font-family="Inter" font-weight="700">Welcome back</text>
<text x="430" y="235" fill="#475569" font-size="16" font-family="Inter">Login securely with MFA</text>
<text x="430" y="285" fill="#0F172A" font-size="14" font-family="Inter">Email / Username</text>
<rect x="430" y="300" width="420" height="52" rx="10" fill="#F8FAFC" stroke="#CBD5E1"/>
<text x="448" y="333" fill="#94A3B8" font-size="14" font-family="Inter">name@example.com</text>
<text x="430" y="380" fill="#0F172A" font-size="14" font-family="Inter">Password</text>
<rect x="430" y="395" width="420" height="52" rx="10" fill="#F8FAFC" stroke="#CBD5E1"/>
<text x="448" y="428" fill="#94A3B8" font-size="14" font-family="Inter">••••••••••••</text>
<text x="775" y="428" fill="#2563EB" font-size="13" font-family="Inter">Show</text>
<rect x="430" y="470" width="20" height="20" rx="4" fill="#FFFFFF" stroke="#94A3B8"/>
<text x="460" y="485" fill="#334155" font-size="14" font-family="Inter">Remember this device</text>
<text x="700" y="485" fill="#2563EB" font-size="14" font-family="Inter">Forgot password?</text>
<rect x="430" y="515" width="420" height="52" rx="10" fill="#1D4ED8"/>
<text x="605" y="548" fill="#FFFFFF" font-size="16" font-family="Inter" font-weight="600">Sign in</text>
<rect x="430" y="585" width="420" height="95" rx="12" fill="#EFF6FF" stroke="#BFDBFE"/>
<text x="448" y="612" fill="#1D4ED8" font-size="14" font-family="Inter" font-weight="600">Two-factor authentication</text>
<text x="448" y="634" fill="#334155" font-size="13" font-family="Inter">Enter the 6-digit code sent to your phone</text>
<rect x="448" y="646" width="180" height="24" rx="6" fill="#DBEAFE"/>
<text x="455" y="663" fill="#1E3A8A" font-size="12" font-family="Inter">Resend code in 00:27</text>
<text x="430" y="715" fill="#475569" font-size="13" font-family="Inter">HCI: visibility, error prevention, user control, consistency.</text>
</svg>